services:
  dspace:
    container_name: dspace
    image: "${DOCKER_REGISTRY:-docker.io}/${DOCKER_OWNER:-dspace}/dspace:${DSPACE_VER:-latest}"
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # DSpace configuration directory
      dspace__P__dir: "/dspace"
      # Database configuration - credentials from environment
      db__P__url: "${DB_URL:-jdbc:postgresql://localhost:5432/dspace}"
      db__P__username: "${DB_USERNAME:?set DB_USERNAME}"
      db__P__password: "${DB_PASSWORD:?set DB_PASSWORD}"
      # Solr configuration
      solr__P__server: "${SOLR_SERVER:-http://localhost:8983/solr}"
      # DSpace URLs
      dspace__P__server__P__url: "${DSPACE_SERVER_URL:-http://localhost:8080/server}"
      dspace__P__ui__P__url: "${DSPACE_UI_URL:-http://localhost:4000}"
      # JVM settings
      JAVA_OPTS: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
      # Spring profile
      SPRING_PROFILES_ACTIVE: "prod"
      # Timezone
      TZ: "UTC"
    volumes:
      - dspace-config:/dspace/config
      - dspace-data:/dspace/assetstore
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/server/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  dspace-config:
  dspace-data:
