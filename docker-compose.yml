version: '3.8'
services:
  dspace:
    image: dspace:latest
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=${DB_HOST:?set DB_HOST}
      - DB_PORT=${DB_PORT:?set DB_PORT}
      - DB_NAME=${DB_NAME:?set DB_NAME}
      - DB_USER=${DB_USER:?set DB_USER}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD}
      - SOLR_HOST=${SOLR_HOST:?set SOLR_HOST}
      - SOLR_PORT=${SOLR_PORT:?set SOLR_PORT}
      - REDIS_HOST=${REDIS_HOST:?set REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:?set REDIS_PORT}
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
    volumes:
      - ./config:/dspace/config:ro
      - ./data:/dspace/data
    restart: unless-stopped
