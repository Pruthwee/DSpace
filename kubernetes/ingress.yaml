apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dspace-ingress
  namespace: dspace
  labels:
    app: dspace
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  rules:
    - host: dspace.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dspace-service
                port:
                  number: 80
