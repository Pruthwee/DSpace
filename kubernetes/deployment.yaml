apiVersion: apps/v1
kind: Deployment
metadata:
  name: dspace
  namespace: dspace
  labels:
    app: dspace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dspace
  template:
    metadata:
      labels:
        app: dspace
    spec:
      containers:
        - name: dspace
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "{{DB_HOST}}"
            - name: DB_PORT
              value: "{{DB_PORT}}"
            - name: DB_NAME
              value: "{{DB_NAME}}"
            - name: DB_USER
              value: "{{DB_USER}}"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dspace-secrets
                  key: DB_PASSWORD
            - name: SOLR_HOST
              value: "{{SOLR_HOST}}"
            - name: SOLR_PORT
              value: "{{SOLR_PORT}}"
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: JAVA_OPTS
              value: "{{JAVA_OPTS}}"
            - name: SPRING_PROFILES_ACTIVE
              value: "{{SPRING_PROFILES_ACTIVE}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
